[project]
name = "ultimate-memory"
version = "0.2.0"
description = "Local-first atomic bi-temporal MCP memory router for Claude Code and Codex."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.116.0",
    "fastembed>=0.7.0",
    "httpx>=0.28.0",
    "jinja2>=3.1.0",
    "mcp>=1.11.0",
    "neo4j>=5.28.0",
    "pydantic>=2.10.0",
    "qdrant-client>=1.14.0",
    "rich>=14.0.0",
    "typer>=0.16.0",
    "uvicorn>=0.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "pytest-cov>=6.2.0",
    "ruff>=0.12.0",
]
llm = [
    "accelerate>=1.0.0",
    "transformers>=4.40.0,<5.0",
    "torch>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/Cookie-Cat21/ultimate-memory"
Repository = "https://github.com/Cookie-Cat21/ultimate-memory"
Issues = "https://github.com/Cookie-Cat21/ultimate-memory/issues"

[project.scripts]
ultimate-memory-router = "ultimate_memory.server:main"
ultimate-memory = "ultimate_memory.cli:app"
ultimate-memory-dashboard = "ultimate_memory.dashboard.app:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

