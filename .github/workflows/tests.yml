name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Benchmark integrity
        run: uv run python scripts/check_benchmark_integrity.py

      - name: Clean benchmark smoke test
        run: uv run python evals/run_clean_benchmarks.py --quick

      - name: Clean benchmark holdout smoke test
        run: uv run python evals/run_clean_benchmarks.py --start-dialog 1 --max-dialogs 1 --max-questions 40

      - name: Run tests
        run: uv run pytest tests/ -k "not Live" -q
