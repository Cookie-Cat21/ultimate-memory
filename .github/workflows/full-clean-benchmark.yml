name: Full Clean Benchmark

on:
  pull_request:
  workflow_dispatch:

jobs:
  clean-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ULTIMATE_MEMORY_LOCAL_SEMANTIC: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Benchmark integrity
        run: uv run python scripts/check_benchmark_integrity.py
      - name: Full clean LoCoMo benchmark
        run: uv run python evals/run_clean_benchmarks.py
